<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnect Hush</title><style>body{background:#101c24;color:#edf8f4;font:20px system-ui;max-width:500px;margin:70px auto;padding:24px}a{color:#6ff2be}p{line-height:1.6}</style><h1>Hush</h1><p id="status">Waiting for the secure demo link…</p><p><a id="link" hidden>Open microphone demo →</a></p><p>Keep your phone on the same Wi-Fi network as the board. After switching power, allow about a minute for startup.</p><script>
async function check(){try{const r=await fetch('demo-url.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const url=(await r.text()).trim();if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url))throw Error();const a=document.querySelector('#link');a.href=url;a.hidden=false;document.querySelector('#status').textContent='Ready. Open the secure demo, then tap Start microphone.';}catch(e){document.querySelector('#status').textContent='Board is starting or waiting for internet. This page checks automatically.';document.querySelector('#link').hidden=true;}}check();setInterval(check,2500);
</script></html>
